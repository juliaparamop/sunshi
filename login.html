<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUNSHI | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Inicio de sesión SUNSHI">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-wrapper">

    <!-- PANEL VISUAL -->
    <div class="login-visual">
    <img src="Recursos/imagenes/img_forms.svg">
    </div>

    <!-- FORMULARIO -->
    <div class="login-form">
        <div class="form-card">
              <!-- LOGO -->
            <div class="logo">
              <a href="index.html" class="logo">
                <img src="Recursos/sunshi_azul.svg" alt="Logo Sunshi" class="logo-img">
                <h1 class="sunshi">SUNSHI</h1>
              </a>
            </div>
            <h2>Iniciar sesión</h2>


              <form id="loginForm">
                  <div class="form-group">
                    <input type="email" id="email" placeholder="Correo electrónico" required>
                  </div>

                  <div class="form-group password-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <span class="toggle-pass" onclick="togglePassword()">👁</span>
                  </div>

                  <div class="forgot">
                    <a href="#" onclick="resetPassword()">¿Olvidaste tu contraseña?</a>
                  </div>

                  <button class="btn-login-main">Entrar</button>
              </form>

              <div class="divider"></div>

              <button class="btn-google" onclick="loginGoogle()">
                Continuar con Google
              </button>

              <p class="register-link">
                ¿No tienes cuenta?
                <a href="register.html">Regístrate</a>
              </p>
        </div>
    </div>
</div>




<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBMvZu9E8cp_b6pFKkwqjWl0ldFmuSWuAg",
  authDomain: "sunshi-app.firebaseapp.com",
  projectId: "sunshi-app",
  storageBucket: "sunshi-app.firebasestorage.app",
  messagingSenderId: "519588346387",
  appId: "1:519588346387:web:9e1dfd8499ded8fad41de6"
};


/* INICIALIZAR FIREBASE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* LOGIN EMAIL */

document
.getElementById("loginForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;


try{

const cred = await signInWithEmailAndPassword(auth,email,password);

const docRef = doc(db,"usuarios",cred.user.uid);
const docSnap = await getDoc(docRef);

if(!docSnap.exists()){
alert("Lo sentimos. Tu usuario no tiene registro en la base de datos.");
return;
}

const rol = docSnap.data().rol;

if(rol === "admin"){
window.location.href="admin.html";
}else{
window.location.href="usuarios.html";
}

}catch(error){

if(error.code === "auth/user-not-found"){
alert("Upps.. Al parecer tu usuario no está registrado.");
return;
}

if(error.code === "auth/wrong-password"){
alert("Contraseña incorrecta. Intenta nuevamente o restablecela.");
return;
}

alert(error.message);

}

});


/* LOGIN GOOGLE */

window.loginGoogle = async ()=>{

const provider = new GoogleAuthProvider();

try{

const cred = await signInWithPopup(auth,provider);

const docRef = doc(db,"usuarios",cred.user.uid);
const docSnap = await getDoc(docRef);

/* SI NO EXISTE USUARIO EN FIRESTORE LO CREAMOS */

if(!docSnap.exists()){

await setDoc(docRef,{
email: cred.user.email,
rol: "usuario",
fechaRegistro: new Date()
});

window.location.href="usuarios.html";

}else{

const rol = docSnap.data().rol;

if(rol === "admin"){
window.location.href="admin.html";
}else{
window.location.href="usuarios.html";
}

}

}catch(error){

alert(error.message);

}

};


/* RESET PASSWORD */

window.resetPassword = async ()=>{

const email = document.getElementById("email").value;

if(!email){
alert("Ingresa tu correo para recuperar la contraseña.");
return;
}

try{

await sendPasswordResetEmail(auth,email);
alert("Correo de recuperación enviado. Revisa tu bandeja de entrada o Spam");

}catch(error){

alert(error.message);

}

};


/* MOSTRAR / OCULTAR CONTRASEÑA */

window.togglePassword = ()=>{

const pass = document.getElementById("password");

pass.type = pass.type==="password" ? "text" : "password";

};
</script>





</body>
</html>
