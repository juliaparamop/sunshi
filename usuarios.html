<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUNSHI | Usuarios</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Página para usuarios clientes logeados">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="usuarios.css">

</head>




<body>
  <!-- HEADER -->
<header class="header">
  <div class="container">

    <!-- LOGO -->
    <div class="logo">
      <a href="#" class="logo">
        <img src="Recursos/sunshi.svg" alt="Logo Sunshi" class="logo-img">
        <span>SUNSHI</span>
      </a>
    </div>

    <!-- BOTÓN MENÚ (mobile) -->
    <button class="menu-toggle" aria-label="Abrir menú">
      ☰
    </button>

    <!-- NAVEGACIÓN -->
    <nav>
      <a href="#valor">Valor</a>
      <a href="#nosotros">Historia</a>
      <a href="#productos">Menú</a>
      <!-- <a href="#contacto_acceso" class="btn-nav">Ordenar</a> -->

      <div class="auth-buttons">
        <a id="btnLogin" class="btn-login">Cerrar sesión</a> 
        <a id="btnPerfil" class="btn-profile">Perfil</a> 
      </div>
    </nav>

  </div>
</header>



<!-- SCRIPT -->
<script>
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('nav');

  toggle.addEventListener('click', () => {
    nav.classList.toggle('active');
  });
</script>



<!-- HERO ==========================================================================================  -->
<section class="hero">
  <div class="hero-bg">
    <img src="Recursos/imagenes/fondoPrincipal.JPG" alt="Sunshi sushi">
  </div>

  <div class="hero-content">
    <h1>SUNSHI</h1>
    <h2 class="slogan">Un rollito de sol cada día</h2>
    <a href="formulario.html" class="btn-hero">Ordenar ahora</a>
  </div>
</section>







<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBMvZu9E8cp_b6pFKkwqjWl0ldFmuSWuAg",
  authDomain: "sunshi-app.firebaseapp.com",
  projectId: "sunshi-app",
  storageBucket: "sunshi-app.firebasestorage.app",
  messagingSenderId: "519588346387",
  appId: "1:519588346387:web:9e1dfd8499ded8fad41de6"
};

/* INICIALIZAR FIREBASE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* PROTEGER PÁGINA SOLO USUARIOS */

onAuthStateChanged(auth, async (user) => {

if (!user) {
window.location.href = "index.html";
return;
}

try{

const docRef = doc(db, "usuarios", user.uid);
const docSnap = await getDoc(docRef);

if (!docSnap.exists() || docSnap.data().rol !== "usuario") {
window.location.href = "index.html";
}

}catch(error){

console.error("Error verificando rol:", error);
window.location.href = "index.html";

}

});

/* CERRAR SESIÓN */

const logoutBtn = document.getElementById("btnLogin");

if(logoutBtn){

logoutBtn.addEventListener("click", async ()=>{

await signOut(auth);
window.location.href = "index.html";

});

}

</script>


</body>
</html>
