<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>SUNSHI | Registro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="register.css">

</head>

<body>

<div class="register-wrapper">

<!-- ILUSTRACIÓN -->
<div class="register-visual">
<img src="Recursos/imagenes/img_forms.svg" alt="Registro SUNSHI">
</div>


<!-- FORMULARIO -->
<div class="register-form">

<div class="form-card">

          <!-- LOGO -->
          <div class="logo">
            <a href="index.html" class="logo">
              <img src="Recursos/sunshi_morado.svg" alt="Logo Sunshi" class="logo-img">
              <h1 class="sunshi">SUNSHI</h1>
            </a>
          </div>
          <h2>Registro</h2>


          <form id="registerForm">

          <div class="form-group">
          <input type="email" id="email" placeholder="Correo electrónico" required>
          </div>

          <div class="form-group password-group">

          <input type="password" id="password" placeholder="Contraseña" required>

          <span class="toggle-pass" onclick="togglePassword()">👁</span>

          </div>

          <button class="btn-register-main">
          Crear cuenta
          </button>

          </form>

          <div class="divider"></div>

          <button class="btn-google" onclick="registerGoogle()">
          Continuar con Google
          </button>

          <p class="login-link">
          ¿Ya tienes cuenta?
          <a href="login.html">Inicia sesión</a>
          </p>

</div>

</div>

</div>




<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBMvZu9E8cp_b6pFKkwqjWl0ldFmuSWuAg",
  authDomain: "sunshi-app.firebaseapp.com",
  projectId: "sunshi-app",
  storageBucket: "sunshi-app.firebasestorage.app",
  messagingSenderId: "519588346387",
  appId: "1:519588346387:web:9e1dfd8499ded8fad41de6"
};


/* INICIALIZAR FIREBASE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* REGISTRO CON EMAIL */

document
.getElementById("registerForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

const cred = await createUserWithEmailAndPassword(auth,email,password);

/* CREAR DOCUMENTO USUARIO */

await setDoc(doc(db,"usuarios",cred.user.uid),{

email: email,
rol: "usuario",
fechaRegistro: new Date()

});

alert("Cuenta creada correctamente");
window.location.href = "usuarios.html";

}catch(error){

if(error.code === "auth/email-already-in-use"){
alert("Este correo ya está registrado. Inicia sesión para acceder a tu cuenta.");
return;
}

alert("Error al crear cuenta: "+error.message);


}

});


/* REGISTRO / LOGIN CON GOOGLE */

window.registerGoogle = async ()=>{

const provider = new GoogleAuthProvider();

try{

const cred = await signInWithPopup(auth,provider);

/* VERIFICAR SI YA EXISTE USUARIO */

const docRef = doc(db,"usuarios",cred.user.uid);
const docSnap = await getDoc(docRef);

if(!docSnap.exists()){

await setDoc(docRef,{
email: cred.user.email,
rol: "usuario",
fechaRegistro: new Date()
});

}

window.location.href="usuarios.html";

}catch(error){

alert(error.message);

}

};


/* MOSTRAR CONTRASEÑA */

window.togglePassword = ()=>{

const pass = document.getElementById("password");

pass.type = pass.type==="password" ? "text" : "password";

};

</script>
</body>
</html>
